spring.application.name=auth
server.port=${SERVER_PORT:8086}

# --- Database (PostgreSQL) ---
# Defaults match docker-compose.yml; override with env vars in other environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:oletrex}
spring.datasource.password=${DB_PASSWORD:oletrex}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Tokens issued by this service (RS256) ---
auth.issuer=${AUTH_ISSUER:oletrex-auth}
auth.jwt-ttl=${JWT_TTL:1h}
auth.admin.email=${ADMIN_EMAIL:admin@oletrex.local}
auth.admin.password=${ADMIN_PASSWORD:Admin123!}
# true: re-hash the existing admin with auth.admin.password on start (set for ONE start only)
auth.admin.reset-password=${ADMIN_RESET_PASSWORD:false}
auth.service-clients.order-service=${ORDER_SERVICE_SECRET:order-dev-secret}
auth.service-clients.inventory-service=${INVENTORY_SERVICE_SECRET:inventory-dev-secret}

# --- Outbound calls (customer service, used during registration) ---
services.customer.base-url=${CUSTOMER_SERVICE_URL:http://localhost:8085}
services.http.connect-timeout=2s
services.http.read-timeout=8s

# --- Security: this service validates tokens with its own public key (no JWKS call to itself) ---
security.jwt.issuer=${AUTH_ISSUER:oletrex-auth}

# --- API docs (springdoc / Swagger UI) ---
# UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
