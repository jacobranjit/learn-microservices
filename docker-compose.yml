# Local development infrastructure.
#   Start:  docker compose up -d
#   Stop:   docker compose down        (add -v to also wipe the data)
services:
  postgres:
    image: postgres:18-alpine
    container_name: oletrex-postgres
    environment:
      POSTGRES_USER: oletrex
      POSTGRES_PASSWORD: oletrex   # local dev only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs once, on first start with an empty volume: creates one database per service.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oletrex"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
