# Oletrex microservices: PostgreSQL + product, inventory, order and customer services
# (+ generate-master-data on demand), each in its own container with CPU and RAM limits.
#
#   Everything:          docker compose up -d --build
#   Only the database:   docker compose up -d postgres        (when running the services from the IDE)
#   Seed test data:      docker compose --profile seed up -d --build generate-master-data
#   Status / usage:      docker compose ps    |    docker stats
#   Stop:                docker compose down                   (add -v to also wipe the data)
#
# Database credentials come from .env (POSTGRES_USER / POSTGRES_PASSWORD); set your own on any server.
# Limits default to the values below; override any of them with environment variables
# or an .env file next to this file (see .env.example).
# Sized for a 4-core / 8 GB machine: worst case (every container at its limit) is 4.5 GB RAM.
# Limits are caps, not reservations: at rest the whole stack uses about 1.3 GB.

x-java-service: &java-service
  restart: unless-stopped
  environment: &java-env
    # Heap = 75% of the container's memory limit; restart instead of limping on after OutOfMemoryError.
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
    # Same credentials as the postgres container below (from .env; defaults are for local dev only).
    DB_USERNAME: "${POSTGRES_USER:-oletrex}"
    DB_PASSWORD: "${POSTGRES_PASSWORD:-oletrex}"
    # Token issuer every service checks (must match the auth service).
    AUTH_ISSUER: "${AUTH_ISSUER:-oletrex-auth}"

services:
  postgres:
    image: postgres:18-alpine
    container_name: oletrex-postgres
    restart: unless-stopped
    environment:
      # Applied only when the database is first created (empty volume); see .env.example.
      POSTGRES_USER: "${POSTGRES_USER:-oletrex}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-oletrex}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs once, on first start with an empty volume: creates one database per service.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-1.0}"
          memory: "${POSTGRES_MEMORY:-512M}"

  product:
    <<: *java-service
    build: ./product
    image: oletrex/product:latest
    container_name: oletrex-product
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/product_db
    ports:
      - "${PRODUCT_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "${PRODUCT_CPUS:-1.0}"
          memory: "${PRODUCT_MEMORY:-1G}"

  inventory:
    <<: *java-service
    build: ./inventory
    image: oletrex/inventory:latest
    container_name: oletrex-inventory
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      PRODUCT_SERVICE_URL: http://product:8082
    ports:
      - "${INVENTORY_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      product:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "${INVENTORY_CPUS:-1.0}"
          memory: "${INVENTORY_MEMORY:-1G}"

  order:
    <<: *java-service
    build: ./order
    image: oletrex/order:latest
    container_name: oletrex-order
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      PRODUCT_SERVICE_URL: http://product:8082
      INVENTORY_SERVICE_URL: http://inventory:8083
    ports:
      - "${ORDER_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      product:
        condition: service_started
      inventory:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "${ORDER_CPUS:-1.0}"
          memory: "${ORDER_MEMORY:-1G}"

  customer:
    <<: *java-service
    build: ./customer
    image: oletrex/customer:latest
    container_name: oletrex-customer
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/customer_db
      AUTH_JWKS_URL: http://auth:8086/.well-known/jwks.json
    ports:
      - "${CUSTOMER_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "${CUSTOMER_CPUS:-0.5}"
          memory: "${CUSTOMER_MEMORY:-768M}"

  auth:
    <<: *java-service
    build: ./auth
    image: oletrex/auth:latest
    container_name: oletrex-auth
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      CUSTOMER_SERVICE_URL: http://customer:8085
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@oletrex.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Admin123!}"
      ORDER_SERVICE_SECRET: "${ORDER_SERVICE_SECRET:-order-dev-secret}"
      INVENTORY_SERVICE_SECRET: "${INVENTORY_SERVICE_SECRET:-inventory-dev-secret}"
      JWT_TTL: "${JWT_TTL:-1h}"
    ports:
      - "${AUTH_PORT:-8086}:8086"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "${AUTH_CPUS:-0.5}"
          memory: "${AUTH_MEMORY:-768M}"

  # Only started with --profile seed. Populates the CSV master data once product and
  # inventory are healthy, then stays up so populate can be re-run on port 8084.
  generate-master-data:
    <<: *java-service
    build: ./generate-master-data
    image: oletrex/generate-master-data:latest
    container_name: oletrex-generate-master-data
    profiles: ["seed"]
    restart: "no"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
      PRODUCT_SERVICE_URL: http://product:8082
      INVENTORY_SERVICE_URL: http://inventory:8083
      MASTERDATA_POPULATE_ON_STARTUP: "true"
    ports:
      - "${MASTERDATA_PORT:-8084}:8084"
    depends_on:
      product:
        condition: service_healthy
      inventory:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${MASTERDATA_CPUS:-0.5}"
          memory: "${MASTERDATA_MEMORY:-1G}"

volumes:
  postgres-data:
