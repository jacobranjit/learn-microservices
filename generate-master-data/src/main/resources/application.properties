spring.application.name=generate-master-data
server.port=${SERVER_PORT:8084}

# --- Master data ---
# Folder holding locations.csv, products.csv and inventory.csv.
# Default: the CSVs bundled in this service. Use e.g. file:/path/to/folder/ for your own files.
masterdata.source=${MASTERDATA_SOURCE:classpath:master-data/}
# Populate automatically once the service has started (the API works either way).
masterdata.populate-on-startup=${MASTERDATA_POPULATE_ON_STARTUP:false}
# How many API calls to run at the same time.
masterdata.parallelism=8

# --- Services to populate ---
services.product.base-url=${PRODUCT_SERVICE_URL:http://localhost:8082}
services.inventory.base-url=${INVENTORY_SERVICE_URL:http://localhost:8083}
services.http.connect-timeout=2s
services.http.read-timeout=10s

# --- API docs (springdoc / Swagger UI) ---
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
