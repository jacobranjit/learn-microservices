spring.application.name=generate-master-data
server.port=${SERVER_PORT:8084}

# --- Master data ---
# Folder holding locations.csv, products.csv, inventory.csv and customers.csv.
# Default: the CSVs bundled in this service. Use e.g. file:/path/to/folder/ for your own files.
masterdata.source=${MASTERDATA_SOURCE:classpath:master-data/}
# Populate automatically once the service has started (the API works either way).
masterdata.populate-on-startup=${MASTERDATA_POPULATE_ON_STARTUP:false}
# How many API calls to run at the same time.
masterdata.parallelism=8
# Admin account used to call the product and inventory APIs (created by the auth service on startup).
masterdata.admin.email=${ADMIN_EMAIL:admin@oletrex.local}
masterdata.admin.password=${ADMIN_PASSWORD:Admin123!}
# Password given to every seeded customer (customers.csv).
masterdata.customer-password=${MASTERDATA_CUSTOMER_PASSWORD:Customer123!}

# --- Services to populate ---
services.product.base-url=${PRODUCT_SERVICE_URL:http://localhost:8082}
services.inventory.base-url=${INVENTORY_SERVICE_URL:http://localhost:8083}
services.auth.base-url=${AUTH_SERVICE_URL:http://localhost:8086}
services.customer.base-url=${CUSTOMER_SERVICE_URL:http://localhost:8085}
services.http.connect-timeout=2s
services.http.read-timeout=10s

# --- Security (JWT resource server) ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URL:http://localhost:8086/.well-known/jwks.json}
security.jwt.issuer=${AUTH_ISSUER:oletrex-auth}

# --- API docs (springdoc / Swagger UI) ---
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
