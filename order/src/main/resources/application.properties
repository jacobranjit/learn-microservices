spring.application.name=order
server.port=${SERVER_PORT:8081}

# --- Database (PostgreSQL) ---
# Defaults match docker-compose.yml; override with env vars in other environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=${DB_USERNAME:oletrex}
spring.datasource.password=${DB_PASSWORD:oletrex}

# --- JPA / Hibernate ---
# "update" creates/alters tables from the @Entity classes. Fine for learning;
# switch to "validate" plus Flyway/Liquibase migrations before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- API docs (springdoc / Swagger UI) ---
# UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Security (JWT resource server; tokens are issued by the auth service) ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URL:http://localhost:8086/.well-known/jwks.json}
security.jwt.issuer=${AUTH_ISSUER:oletrex-auth}

# --- Downstream services ---
services.product.base-url=${PRODUCT_SERVICE_URL:http://localhost:8082}
services.inventory.base-url=${INVENTORY_SERVICE_URL:http://localhost:8083}
services.http.connect-timeout=2s
services.http.read-timeout=5s

# --- Service token (order calls product and inventory as a SERVICE) ---
services.auth.base-url=${AUTH_SERVICE_URL:http://localhost:8086}
services.auth.client-id=order-service
services.auth.client-secret=${ORDER_SERVICE_SECRET:order-dev-secret}
