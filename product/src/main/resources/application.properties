spring.application.name=product
server.port=${SERVER_PORT:8082}

# --- Database (PostgreSQL) ---
# Defaults match docker-compose.yml; override with env vars in other environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_db}
spring.datasource.username=${DB_USERNAME:oletrex}
spring.datasource.password=${DB_PASSWORD:oletrex}

# --- JPA / Hibernate ---
# "update" creates/alters tables from the @Entity classes. Fine for learning;
# switch to "validate" plus Flyway/Liquibase migrations before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
